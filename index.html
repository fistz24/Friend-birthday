<style>

.plt{position:relative;width:240px;height:120px;margin:8px auto;transition:opacity .6s}.plt .pl{position:absolute;left:0;bottom:0;width:100%}.plt .pa{position:absolute;left:50%;bottom:22%;height:68%;transform:translateX(-50%);animation:pd .6s}@keyframes pd{from{transform:translate(-50%,-80px);opacity:0}}.plt.slide{animation:ps .8s}@keyframes ps{from{transform:translateX(70px);opacity:0}}
.prep{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap}.ocard{padding:14px;max-width:540px;margin:0 auto;text-align:left;background:#fff}.ocard h3{text-align:center;margin:0 0 6px;font-size:26px}.ocard p{margin:3px 0}
#orderBtn{position:absolute;left:8px;top:44px;z-index:5;padding:4px 14px;font-size:16px}
.wearIn{animation:wi .4s}@keyframes wi{from{opacity:0}}

.cd.spk{left:38%;top:0;width:27%;height:36%}#cakeSay{padding:6px 14px;text-align:center;font-size:18px}#cakeBox{position:relative;width:100%}#cakeBox>img{width:100%;display:block}

</style></head><body>
<button id="snd">Sound: on</button>
<div id="scene1" class="scene active"><div id="bubble" class="sketch">Tap the door to knock.</div>
